<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backup Database – Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="visualizza.css" />
</head>
<body class="bg-light">
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="h3 mb-1"><i class="fas fa-database me-2"></i>Backup Database</h1>
        <div class="text-muted small">Pagina amministratore</div>
      </div>
      <div class="d-flex gap-2">
        <a href="index1.html" class="btn btn-outline-secondary">
          <i class="fas fa-home me-2"></i>Home
        </a>
        <button id="logoutBtn" class="btn btn-outline-danger">
          <i class="fas fa-sign-out-alt me-2"></i>Logout
        </button>
      </div>
    </div>

    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
          <div>
            <div class="fw-semibold">Utente</div>
            <div id="userEmail" class="text-muted">–</div>
          </div>
          <div>
            <div class="fw-semibold">Stato</div>
            <div id="status" class="text-muted">Verifica autenticazione…</div>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <div class="mb-3">
          <div class="fw-semibold">Backup completo</div>
          <div class="text-muted small">Scarica tutto il contenuto del database in formato JSON.</div>
        </div>
        <div class="d-flex flex-wrap gap-2">
          <button id="downloadBtn" class="btn btn-primary" disabled>
            <i class="fas fa-download me-2"></i>Scarica backup completo
          </button>
          <a href="backup-viewer.html" class="btn btn-outline-primary">
            <i class="fas fa-search me-2"></i>Apri visualizzatore
          </a>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="admin-backup.js"></script>
</body>
</html>
