<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visualizzatore Backup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="visualizza.css" />
</head>
<body class="bg-light">
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="h3 mb-1"><i class="fas fa-file-code me-2"></i>Visualizzatore Backup</h1>
        <div class="text-muted small">Apri un file JSON di backup e naviga i dati</div>
      </div>
      <div class="d-flex gap-2">
        <a href="admin-backup.html" class="btn btn-outline-secondary">
          <i class="fas fa-arrow-left me-2"></i>Indietro
        </a>
        <button id="logoutBtn" class="btn btn-outline-danger">
          <i class="fas fa-sign-out-alt me-2"></i>Logout
        </button>
      </div>
    </div>

    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <div class="row g-3 align-items-end">
          <div class="col-lg-6">
            <label for="fileInput" class="form-label">File backup (.json)</label>
            <input id="fileInput" type="file" class="form-control" accept="application/json,.json" />
          </div>
          <div class="col-lg-6">
            <div class="d-flex justify-content-between">
              <div>
                <div class="fw-semibold">Utente</div>
                <div id="userEmail" class="text-muted">–</div>
              </div>
              <div class="text-end">
                <div class="fw-semibold">Stato</div>
                <div id="status" class="text-muted">Verifica autenticazione…</div>
              </div>
            </div>
          </div>
          <div class="col-12">
            <div id="meta" class="text-muted small">Nessun file caricato.</div>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-4">
            <label for="tipoSelect" class="form-label">Tipo dati</label>
            <select id="tipoSelect" class="form-select" disabled>
              <option value="zadankai">Zadankai</option>
              <option value="studio_gosho">Studio Gosho</option>
            </select>
          </div>
          <div class="col-md-4">
            <label for="annoSelect" class="form-label">Anno</label>
            <select id="annoSelect" class="form-select" disabled></select>
          </div>
          <div class="col-md-4">
            <label for="meseSelect" class="form-label">Mese</label>
            <select id="meseSelect" class="form-select" disabled></select>
          </div>
          <div class="col-12">
            <div class="d-flex flex-wrap gap-2">
              <button id="resetFiltersBtn" class="btn btn-outline-secondary" disabled>
                <i class="fas fa-eraser me-2"></i>Reset filtri
              </button>
              <span id="counts" class="text-muted small align-self-center"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-header bg-white">
        <div class="fw-semibold">Record</div>
      </div>
      <div class="card-body table-responsive">
        <table class="table table-sm table-striped align-middle mb-0">
          <thead>
            <tr>
              <th>Anno</th>
              <th>Mese</th>
              <th>Gruppo</th>
              <th class="text-end">Azioni</th>
            </tr>
          </thead>
          <tbody id="recordsBody">
            <tr><td colspan="4" class="text-muted">Carica un file per vedere i record.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="detailTitle">Dettaglio</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Chiudi"></button>
        </div>
        <div class="modal-body">
          <pre id="detailPre" class="mb-0" style="white-space: pre-wrap;"></pre>
        </div>
        <div class="modal-footer">
          <button id="copyBtn" type="button" class="btn btn-outline-primary">
            <i class="fas fa-copy me-2"></i>Copia JSON
          </button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Chiudi</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="backup-viewer.js"></script>
</body>
</html>
